<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto : : Lista</title>
    <style>
        * {
            box-sizing: border-box;
        }
    
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 3rem 1.5rem;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1a1a1a;
        }

        .quadro {
            width: 100%;
            max-width: 1100px;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
    
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #666;
        }

        .linha-entrada {
            display: flex;
            gap: 0.5rem;
        }
    
        .input-tarefa {
            flex: 1;
            padding: 0.65rem 0.8rem;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease;
        }
    
        .input-tarefa:focus {
            border-color: #6366f1;
        }
    
        .botao-adicionar {
            padding: 0.65rem 1.2rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
    
        .botao-adicionar:hover {
            background: #4f46e5;
        }
        
        .lista-tarefas {
            margin: 1.5rem 0 0;
            padding: 0;
            list-style: none;
        }
    
        .lista-tarefas li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.5rem;
            padding: 0.7rem 0.9rem;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow-wrap: anywhere;
            word-break: break-word;
            transition: background 0.15s ease;
        }
    
        .lista-tarefas li>* {
            min-width: 0;
        }
    
        .lista-tarefas li:hover {
            background: #f4f4f6;
        }
    
        .apagar {
            flex-shrink: 0;
            padding: 0.3rem 0.5rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            color: #b00020;
            white-space: nowrap;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
    
        .apagar:hover {
            background: rgba(176, 0, 32, 0.08);
        }
    </style>
</head>
<body>
    <div class="quadro">
        <label for="input-tarefa">Digite o que deseja adicionar:</label>
        <div class="linha-entrada">
            <input type="text" name="input-tarefa" id="input-tarefa" class="input-tarefa">
            <button class="botao-adicionar">Adicionar</button>
        </div>
        <ul class="lista-tarefas"></ul>
    </div>
    <script>
        const inputTarefa = document.querySelector('.input-tarefa');
        const botaoAdicionar = document.querySelector('.botao-adicionar');
        const listaTarefas = document.querySelector('.lista-tarefas');

        function criarElementoTarefa() {
            const elementoTarefa = document.createElement('li');
            return elementoTarefa;
        }

        function adicionarBotaoApagar(elementoTarefa) {
            const spanTexto = document.createElement('span');
            spanTexto.innerText = elementoTarefa.innerText;
            elementoTarefa.innerText = '';
            elementoTarefa.appendChild(spanTexto);

            const botaoApagar = document.createElement('button');
            botaoApagar.innerText = 'Apagar';
            botaoApagar.setAttribute('class', 'apagar');
            elementoTarefa.appendChild(botaoApagar);
        }

        function adicionarTarefa() {
            const textoTarefa = inputTarefa.value;
            if (!textoTarefa) return alert('Preencha o campo antes de adicionar!');
            criarTarefaNaLista(textoTarefa);
            salvarTarefas();
            inputTarefa.value = '';
        }

        function criarTarefaNaLista(textoTarefa) {
            const elementoTarefa = criarElementoTarefa();
            elementoTarefa.innerText = textoTarefa;
            adicionarBotaoApagar(elementoTarefa);
            listaTarefas.appendChild(elementoTarefa);
        }

        function salvarTarefas() {
            const elementosTarefas = listaTarefas.querySelectorAll('li');
            const tarefas = [];

            for (let elementoTarefa of elementosTarefas) {
                let textoTarefa = elementoTarefa.querySelector('span').innerText.trim();
                tarefas.push(textoTarefa);
            }

            const tarefasJson = JSON.stringify(tarefas);
            localStorage.setItem('tarefas', tarefasJson);
        }

        function carregarTarefas() {
            const tarefasSalvas = localStorage.getItem('tarefas');
            const listaSalva = JSON.parse(tarefasSalvas) || [];

            for (let textoTarefa of listaSalva) {
                criarTarefaNaLista(textoTarefa);
            }
        }

        document.addEventListener('keypress', function (evento) {
            if (evento.keyCode === 13) {
                adicionarTarefa();
            }
        });

        document.addEventListener('click', function (evento) {
            if (evento.target.classList.contains('apagar')) {
                evento.target.parentElement.remove();
                salvarTarefas();
            }
        });

        botaoAdicionar.addEventListener('click', function () {
            adicionarTarefa();
        });

        carregarTarefas();
    </script>
</body>
</html>
